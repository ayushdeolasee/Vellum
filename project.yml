name: Vellum
options:
  bundleIdPrefix: com.vellum
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9DCG97VASG
    DEAD_CODE_STRIPPING: "YES"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
schemes:
  Vellum:
    build:
      targets:
        Vellum: all
        VellumShare: all
        VellumWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VellumTests
  Vellum Mac:
    build:
      targets:
        VellumMac: all
    run:
      config: Debug
targets:
  VellumMac:
    type: application
    platform: macOS
    sources:
      - path: Vellum
    dependencies:
      - package: SwiftMath
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Vellum
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushdeolasee.vellum
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: Vellum/Vellum-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Vellum/Resources/Info.plist
  VellumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          # Bundled below as a folder reference instead of being compiled:
          # `Tests/Integrations/TestSupport/FixtureLoader.swift` resolves the
          # JSON fixtures out of the test bundle at runtime, so the
          # Raindrop/Readwise subdirectory layout has to survive into it.
          - Integrations/Fixtures
      - path: Tests/Integrations/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Vellum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushdeolasee.vellum.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Vellum.app/Vellum
        BUNDLE_LOADER: $(TEST_HOST)
  Vellum:
    type: application
    platform: iOS
    sources:
      - path: Vellum
        excludes:
          - "Resources/Info.plist"
          - "Resources/Info-iOS.plist"
          # Bundled below as a folder reference so the CodeMirror/KaTeX editor
          # keeps its directory layout (editor.html's relative `katex.min.css`
          # and the css's `fonts/*.woff2` only resolve if `katex/` and its
          # `fonts/` subfolder survive into the app bundle).
          - "Resources/katex"
      - path: Vellum/Resources/katex
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftMath
      - target: VellumShare
        embed: true
      - target: VellumWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushdeolasee.vellum
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Vellum/Resources/Info-iOS.plist
        # App Groups are supported by the free/Personal team and are the only
        # capability the Safari extension needs. The iCloud entitlement
        # (Vellum/Vellum-iOS.entitlements) remains intentionally unwired: the
        # free team cannot provision it. Merge the iCloud keys into this file
        # only after moving to a paid Apple Developer account.
        CODE_SIGN_ENTITLEMENTS: Vellum/Vellum-AppGroup.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "NO"
        SUPPORTS_MACCATALYST: "NO"
  VellumShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VellumShare
        excludes:
          - "Info.plist"
          - "VellumShare.entitlements"
      # Keep the extension's link surface deliberately tiny. In particular it
      # cannot see WebKit, WebFetch, WebArchive, or any iCloud storage type.
      - path: Vellum/Services/Capture/CaptureRecord.swift
      - path: Vellum/Services/Capture/CaptureRecordBuilder.swift
      - path: Vellum/Services/Capture/CaptureInboxLayout.swift
      - path: Vellum/Services/Capture/CaptureInboxWriter.swift
      - path: Vellum/Services/Capture/CaptureBackgroundSession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushdeolasee.vellum.share
        PRODUCT_NAME: VellumShare
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: VellumShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: VellumShare/VellumShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SUPPORTS_MACCATALYST: "NO"
  VellumWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VellumWidgets
        excludes:
          - "Info.plist"
          - "VellumWidgets.entitlements"
      # The extension receives only the compact App Group projection and its
      # opaque route parser. It cannot link any library, iCloud, or provider
      # implementation.
      - path: Vellum/Services/Widgets/VellumWidgetSnapshot.swift
      - path: Vellum/Services/Widgets/VellumWidgetSnapshotStore.swift
      - path: Vellum/Services/Widgets/VellumDeepLink.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayushdeolasee.vellum.widgets
        PRODUCT_NAME: VellumWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: VellumWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: VellumWidgets/VellumWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        SUPPORTS_MACCATALYST: "NO"
