name: Vellum
configs:
  Debug: debug
  Release: release
  UITesting: debug
options:
  bundleIdPrefix: com.vellum
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    DEAD_CODE_STRIPPING: "YES"
schemes:
  # The default scheme's test action stays exactly what it was: the hosted unit
  # suite, in Debug. XCUITests launch and drive the real app, which is far too
  # slow (and far too intrusive on a developer's desktop) to run on every
  # `xcodebuild test -scheme Vellum`, so they live in their own scheme below.
  Vellum:
    build:
      targets:
        Vellum: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VellumTests
  VellumUITests:
    build:
      targets:
        Vellum: all
        VellumUITests: [test]
    run:
      config: UITesting
    test:
      config: UITesting
      targets:
        - VellumUITests
targets:
  VellumUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Vellum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vellum.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Vellum
  VellumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Vellum
    settings:
      base:
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.vellum.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Vellum.app/Contents/MacOS/Vellum
  Vellum:
    type: application
    platform: macOS
    sources:
      - path: Vellum
    dependencies:
      - package: SwiftMath
    settings:
      base:
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.vellum.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Vellum/Resources/Info.plist
      configs:
        UITesting:
          # UserDefaults is keyed by bundle identifier. A dedicated identity
          # makes `--ui-test-reset-state` incapable of touching real Vellum
          # preferences while the tests still exercise the production app.
          PRODUCT_BUNDLE_IDENTIFIER: com.vellum.app.uitesting
