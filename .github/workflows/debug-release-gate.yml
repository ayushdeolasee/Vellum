name: Debug release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: debug-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-debug:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Runner availability: actions/runner-images/images/macos/macos-26-Readme.md.
      # OS 27 / Xcode 27 device coverage remains a separate acceptance gate.
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Mac Debug build and focused regressions
        run: >-
          xcodebuild -project Vellum.xcodeproj -scheme 'Vellum Mac'
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/mac-derived-data"
          -resultBundlePath "$RUNNER_TEMP/mac-tests.xcresult"
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Mac App Store Debug build
        run: >-
          xcodebuild -project Vellum.xcodeproj -scheme 'Vellum Mac App Store'
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/store-derived-data"
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-debug-results
          path: ${{ runner.temp }}/mac-tests.xcresult
  mobile-debug:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 17 Pro', 'iPad Pro 13-inch (M5)']
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Universal mobile Debug tests, share and widgets
        run: >-
          xcodebuild -project Vellum.xcodeproj -scheme Vellum
          -configuration Debug
          -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/mobile-derived-data"
          -resultBundlePath "$RUNNER_TEMP/mobile-tests.xcresult"
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-debug-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mobile-tests.xcresult
